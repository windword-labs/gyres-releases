name: Build Desktop Stable Release

on:
  repository_dispatch:
    types: [build-release]
  workflow_dispatch:
    inputs:
      sha:
        description: Full source SHA for packaging acceptance (does not publish)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-${{ github.event.client_payload.tag || inputs.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Read payload
        id: meta
        env:
          SHA: ${{ github.event.client_payload.sha || inputs.sha }}
          TAG: ${{ github.event.client_payload.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ "$EVENT" = repository_dispatch ]; then
            [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: windword-labs/jetstream
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ steps.meta.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable source
        if: github.event_name == 'repository_dispatch'
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$TAG")" = commit
          test "$(git rev-parse "refs/tags/$TAG")" = "$SHA"
          git merge-base --is-ancestor "$SHA" origin/main
          python3 - "$TAG" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path('apps/desktop/internal/version/version.go').read_text()
          assert re.search(r'const Version = "([^"]+)"', text)[1] == sys.argv[1][1:]
          PY
          # Distinguish missing release from API/auth failure.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' > /tmp/tags
          if grep -Fxq "$TAG" /tmp/tags; then echo 'Release already exists'; exit 1; fi
  package:
    needs: validate
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: macos-arm64, runner: macos-latest, os: darwin, arch: arm64}
          - {platform: windows-amd64, runner: windows-2025, os: windows, arch: amd64}
          - {platform: windows-arm64, runner: windows-11-arm, os: windows, arch: arm64}
          - {platform: linux-amd64, runner: ubuntu-24.04, os: linux, arch: amd64}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, os: linux, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: windword-labs/jetstream
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
          path: source
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/apps/desktop/go.mod
          cache-dependency-path: |
            source/apps/desktop/go.sum
            source/apps/core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev patchelf file squashfs-tools xvfb
      - name: Windows installer tools
        if: matrix.os == 'windows'
        run: |
          if [ ! -f '/c/Program Files (x86)/NSIS/makensis.exe' ]; then choco install nsis -y --no-progress; fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.15
          go env GOPATH | sed 's|$|/bin|' >> "$GITHUB_PATH"
      - name: Import macOS signing credentials
        if: matrix.os == 'darwin'
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
        run: bash source/apps/desktop/build/darwin/ci-import-signing.sh
      - name: Embed updater token
        env:
          UPDATER_GITHUB_TOKEN: ${{ secrets.UPDATER_GITHUB_TOKEN }}
        run: bash source/apps/desktop/build/darwin/ci-embed-updater-token.sh
      - name: Package macOS
        if: matrix.os == 'darwin'
        working-directory: source/apps/desktop
        run: |
          wails3 package
          mkdir -p dist
          ditto -c -k --keepParent bin/Gyres.app dist/Gyres-darwin-arm64.zip
          codesign --verify --deep --strict bin/Gyres.app
          xcrun stapler validate bin/Gyres.app
      - name: Package Windows
        if: matrix.os == 'windows'
        working-directory: source/apps/desktop
        run: bash build/windows/package-windows.sh
      - name: Package Linux
        if: matrix.os == 'linux'
        working-directory: source/apps/desktop
        run: bash build/linux/package-appimage.sh
      - name: Verify packaged payload
        working-directory: source/apps/desktop
        run: python3 build/verify-package.py --platform '${{ matrix.os }}' --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: source/apps/desktop/dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [validate, package]
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Publish complete release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          files=(Gyres-darwin-arm64.zip Gyres-windows-amd64.zip Gyres-windows-amd64-installer.exe Gyres-windows-arm64.zip Gyres-windows-arm64-installer.exe Gyres-linux-amd64.AppImage Gyres-linux-arm64.AppImage)
          sha256sum "${files[@]}" > SHA256SUMS
          printf 'Source: windword-labs/jetstream@%s\n\nmacOS ARM64: signed and notarized.\nWindows amd64/ARM64: unsigned installer and portable ZIP.\nLinux amd64/ARM64: unsigned AppImage, Ubuntu 24.04+ baseline.\n' "$SHA" > /tmp/notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Gyres $TAG" --notes-file /tmp/notes.md "${files[@]}" SHA256SUMS
