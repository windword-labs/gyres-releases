name: Build Gyres Mac Release

# Gyres Mac (apps/macos in windword-labs/gyres): stable `mac-vX.Y.Z` and Dev builds,
# Developer ID signed, notarized, EdDSA-signed for Sparkle, published here and added to
# the channel's appcast on the `appcast` branch (served as www.gyres.app/mac/appcast.xml
# and /mac/appcast-dev.xml by the site Worker). Manual dispatch is a build check of one
# SHA: it signs and notarizes but never publishes or touches an appcast.
run-name: Gyres Mac ${{ github.event.client_payload.channel || inputs.channel }} ${{ github.event.client_payload.tag || github.event.client_payload.sha || inputs.sha }}

on:
  repository_dispatch:
    types: [build-mac-release]
  workflow_dispatch:
    inputs:
      sha:
        description: Full source SHA on main (build check only, never publishes)
        required: true
        type: string
      channel:
        description: Channel to build
        type: choice
        options: [dev, stable]
        default: dev

permissions:
  contents: read

concurrency:
  group: mac-${{ github.event.client_payload.tag || github.event.client_payload.sha || inputs.sha }}-${{ github.event.client_payload.channel || inputs.channel }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      channel: ${{ steps.meta.outputs.channel }}
      tag: ${{ steps.meta.outputs.tag }}
      short_version: ${{ steps.meta.outputs.short_version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Require PRIVATE_REPO_PAT
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Set repository secret PRIVATE_REPO_PAT (read windword-labs/gyres)" >&2
            exit 1
          fi

      - name: Read payload
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.client_payload.sha || inputs.sha }}
          CHANNEL: ${{ github.event.client_payload.channel || inputs.channel }}
          SOURCE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          SHA="$(printf '%s' "$SHA" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full SHA" >&2; exit 1; }
          PUBLISH=false
          [ "$EVENT" = repository_dispatch ] && PUBLISH=true
          case "$CHANNEL" in
            stable)
              if [ "$PUBLISH" = true ]; then
                [[ "$SOURCE_TAG" =~ ^mac-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "tag must be mac-vX.Y.Z" >&2; exit 1; }
                TAG="$SOURCE_TAG"
                SHORT="${SOURCE_TAG#mac-v}"
              else
                TAG=""
                SHORT="0.0.0"
              fi
              ;;
            dev)
              TAG="mac-dev-${SHA:0:7}.${GITHUB_RUN_ID}"
              SHORT=""
              ;;
            *) echo "channel must be stable or dev" >&2; exit 1 ;;
          esac
          {
            echo "sha=$SHA"
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "short_version=$SHORT"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout gyres
        uses: actions/checkout@v4
        with:
          repository: windword-labs/gyres
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ steps.meta.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Validate source
        working-directory: source
        env:
          SHA: ${{ steps.meta.outputs.sha }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          TAG: ${{ steps.meta.outputs.tag }}
          PUBLISH: ${{ steps.meta.outputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          git merge-base --is-ancestor "$SHA" origin/main || { echo "SHA is not on gyres main" >&2; exit 1; }
          if [ "$CHANNEL" = stable ] && [ "$PUBLISH" = true ]; then
            test "$(git cat-file -t "refs/tags/$TAG")" = commit || { echo "$TAG must be a lightweight tag" >&2; exit 1; }
            test "$(git rev-parse "refs/tags/$TAG")" = "$SHA" || { echo "$TAG is not $SHA" >&2; exit 1; }
          fi
          if [ "$PUBLISH" = true ] && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

  package:
    needs: validate
    # Xcode 27 (the project's format); public preview image, see actions/runner-images#14404.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: windword-labs/gyres
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install transcript page dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile --filter "@jetstream/transcript-page..."

      - name: Import macOS signing credentials
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
        run: bash source/apps/desktop/build/darwin/ci-import-signing.sh

      - name: Build, sign and notarize
        env:
          OUT_DIR: ${{ runner.temp }}/dist
          DERIVED_DATA: ${{ runner.temp }}/dd
          SHORT_VERSION: ${{ needs.validate.outputs.short_version }}
          REQUIRE_UPDATE_KEY: ${{ needs.validate.outputs.publish == 'true' && '1' || '0' }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          xcodebuild -version
          bash source/apps/macos/scripts/package-release.sh "$CHANNEL"

      - name: Sign the update for Sparkle
        if: needs.validate.outputs.publish == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DIST: ${{ runner.temp }}/dist
          DD: ${{ runner.temp }}/dd
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "Set repository secret SPARKLE_ED_PRIVATE_KEY (Sparkle generate_keys -x, see gyres docs/mac-release.md)" >&2
            exit 1
          fi
          # shellcheck disable=SC1091
          . "$DIST/package.env"
          SIGN_UPDATE="$DD/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          OUTPUT="$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "$DIST/$zip")"
          SIGNATURE="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<<"$OUTPUT")"
          LENGTH="$(sed -n 's/.*length="\([0-9]*\)".*/\1/p' <<<"$OUTPUT")"
          [ -n "$SIGNATURE" ] && [ -n "$LENGTH" ] || { echo "sign_update gave no signature" >&2; exit 1; }
          # The signature must verify with the public key inside the app, or every
          # installed copy would reject this update.
          VERIFY="$(mktemp -d)"
          ditto -x -k "$DIST/$zip" "$VERIFY"
          PUBLIC="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$VERIFY/$name.app/Contents/Info.plist")"
          { printf '302a300506032b6570032100' | xxd -r -p; printf '%s' "$PUBLIC" | base64 -D; } > "$VERIFY/public.der"
          printf '%s' "$SIGNATURE" | base64 -D > "$VERIFY/signature.bin"
          OPENSSL="$(ls /opt/homebrew/opt/openssl@*/bin/openssl | tail -n 1)"
          "$OPENSSL" pkeyutl -verify -pubin -keyform DER -inkey "$VERIFY/public.der" \
            -rawin -in "$DIST/$zip" -sigfile "$VERIFY/signature.bin" \
            || { echo "SPARKLE_ED_PRIVATE_KEY does not match SUPublicEDKey in the app" >&2; exit 1; }
          rm -rf "$VERIFY"
          printf 'ed_signature=%s\nlength=%s\n' "$SIGNATURE" "$LENGTH" > "$DIST/sparkle.env"

      - uses: actions/upload-artifact@v4
        with:
          name: gyres-mac-${{ needs.validate.outputs.channel }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, package]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One appcast writer per channel at a time; the push below also retries on a race.
    concurrency:
      group: mac-appcast-${{ needs.validate.outputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gyres-mac-${{ needs.validate.outputs.channel }}
          path: dist

      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . ./package.env
          sha256sum "$zip" > SHA256SUMS
          NOTES="$(printf '%s %s (%s), Developer ID, notarized, macOS 14+ on Apple silicon\n\n- source: windword-labs/gyres@%s\n' "$name" "$short_version" "$build_number" "$SHA")"
          [ -n "$TITLE" ] && NOTES="$NOTES- $TITLE"
          # Never --latest: the desktop app, standalone Core and the site follow
          # /releases/latest, which must stay a desktop vX.Y.Z.
          FLAGS=(--latest=false)
          [ "$CHANNEL" = dev ] && FLAGS+=(--prerelease)
          # Re-running this failed job (same run, same artifact) finds its own Release;
          # a new run never gets here for an existing tag (validate refuses it).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$zip" SHA256SUMS
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${FLAGS[@]}" \
              --title "$name $short_version" --notes "$NOTES" "$zip" SHA256SUMS
          fi
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ ! "$LATEST" =~ ^v[0-9] ]]; then
            echo "releases/latest is $LATEST, not a desktop release; fix it on GitHub now" >&2
            exit 1
          fi

      - name: Update appcast
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . dist/package.env
          # shellcheck disable=SC1091
          . dist/sparkle.env
          FEED="mac/appcast.xml"
          [ "$CHANNEL" = dev ] && FEED="mac/appcast-dev.xml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            rm -rf appcast
            if git ls-remote --exit-code --heads origin appcast >/dev/null; then
              git fetch -q origin appcast
              git worktree add -q -B appcast appcast FETCH_HEAD
            else
              git worktree add -q --orphan -b appcast appcast
            fi
            mkdir -p appcast/mac
            python3 scripts/mac-appcast.py \
              --feed "appcast/$FEED" --out "appcast/$FEED" \
              --title "$name" --link https://www.gyres.app/ \
              --version "$build_number" --short-version "$short_version" \
              --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$zip" \
              --length "$length" --ed-signature "$ed_signature" \
              --minimum-system-version 14.0
            git -C appcast add "$FEED"
            git -C appcast commit -q -m "$name $short_version ($build_number)"
            if git -C appcast push -q origin appcast; then
              echo "appcast updated: $FEED"
              exit 0
            fi
            git worktree remove --force appcast
            git branch -D appcast
            sleep $((attempt * 5))
          done
          echo "could not push the appcast" >&2
          exit 1
